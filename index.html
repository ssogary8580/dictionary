<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>국어사전 탐험대</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background-color: #f0fdf4;
            background-image: radial-gradient(#bbf7d0 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .step-container {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }
        .step-container.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounce-subtle {
            0%, 100% { transform: translateY(-2px); }
            50% { transform: translateY(2px); }
        }
        .btn-bounce {
            transition: transform 0.1s;
        }
        .btn-bounce:active {
            transform: scale(0.95);
        }
        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.2s ease-in-out;
        }
        .char-box {
            display: inline-block;
            width: 50px;
            height: 50px;
            line-height: 50px;
            text-align: center;
            border-radius: 12px;
            font-size: 24px;
            margin: 0 4px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-gray-800">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden border-4 border-green-400 relative">
        <!-- Header -->
        <div class="bg-green-400 text-white p-4 text-center">
            <h1 class="text-3xl font-bold tracking-wide">📖 국어사전 탐험대</h1>
            <p class="text-sm mt-1 opacity-90">참고 자료: 국어3-2지도서_2_5.pdf</p>
        </div>

        <div class="p-6">
            <!-- Step 1: Input Word -->
            <div id="step1" class="step-container active text-center">
                <div class="text-6xl mb-4" style="animation: bounce-subtle 2s infinite;">🧐</div>
                <h2 class="text-2xl mb-4">국어사전에서 찾고 싶은<br><span class="text-green-600">낱말</span>을 입력해 주세요!</h2>
                <input type="text" id="wordInput" class="w-full text-center text-3xl p-4 border-4 border-green-200 rounded-2xl focus:outline-none focus:border-green-500 transition-colors mb-4" placeholder="예: 학교, 먹고, 맑으니" autocomplete="off">
                <button onclick="startJourney()" class="btn-bounce w-full bg-green-500 hover:bg-green-600 text-white text-2xl py-4 rounded-2xl shadow-lg">사전 찾기 출발!</button>
            </div>

            <!-- Step 2: Form Change Selection -->
            <div id="step2" class="step-container text-center">
                <div class="text-5xl mb-4">🤔</div>
                <h2 class="text-2xl mb-2 text-green-600">"<span id="displayWord1" class="text-3xl font-bold text-red-500"></span>"</h2>
                <h3 class="text-xl mb-6">이 낱말은 형태가 바뀌는 부분인가요?</h3>
                
                <div class="space-y-4">
                    <button onclick="checkFormChange(false)" class="btn-bounce w-full bg-blue-100 hover:bg-blue-200 border-2 border-blue-300 text-blue-700 text-xl py-4 rounded-2xl shadow-sm flex flex-col items-center justify-center">
                        <span>❌ 아니요 (이름을 나타내는 낱말)</span>
                        <span class="text-sm text-blue-500 mt-1">예: 책상, 사과, 친구</span>
                    </button>
                    <button onclick="checkFormChange(true)" class="btn-bounce w-full bg-orange-100 hover:bg-orange-200 border-2 border-orange-300 text-orange-700 text-xl py-4 rounded-2xl shadow-sm flex flex-col items-center justify-center">
                        <span>⭕ 네 (움직임이나 성질을 나타내는 낱말)</span>
                        <span class="text-sm text-orange-500 mt-1">예: 먹고, 뛰니, 예뻐서</span>
                    </button>
                </div>
            </div>

            <!-- Step 3: Base Form Creation -->
            <div id="step3" class="step-container text-center">
                <div class="text-5xl mb-4">💡</div>
                <h2 class="text-2xl mb-2 text-orange-600">"<span id="displayWord2" class="text-3xl font-bold text-red-500"></span>"</h2>
                <p class="text-lg mb-6 leading-relaxed bg-orange-50 p-3 rounded-xl border border-orange-200">
                    사전에서 찾으려면 <b>기본형</b>으로 만들어야 해요!<br>
                    형태가 바뀌지 않는 부분에 <span class="text-red-500 text-xl">'다'</span>를 붙여보세요.
                </p>
                <input type="text" id="baseFormInput" class="w-full text-center text-3xl p-4 border-4 border-orange-200 rounded-2xl focus:outline-none focus:border-orange-500 transition-colors mb-4" placeholder="예: 먹다">
                <button onclick="checkBaseForm()" class="btn-bounce w-full bg-orange-500 hover:bg-orange-600 text-white text-2xl py-4 rounded-2xl shadow-lg">확인하기!</button>
            </div>

            <!-- Step 4: Dictionary Search Guide (Interactive Step-by-Step) -->
            <div id="step4" class="step-container text-center">
                <div class="text-5xl mb-2" id="step4Icon">🔍</div>
                <h2 class="text-2xl mb-1">국어사전 찾는 순서 안내</h2>
                <p class="text-lg mb-3">찾을 낱말: <span id="finalWord" class="text-3xl text-green-600 font-bold"></span></p>

                <!-- 글자별 단계 안내 영역 -->
                <div id="charGuideContainer"></div>

                <button onclick="resetApp()" class="btn-bounce mt-4 w-full bg-gray-200 hover:bg-gray-300 text-gray-700 text-lg py-3 rounded-2xl font-bold">다른 낱말 찾아보기</button>
            </div>
        </div>
    </div>

    <!-- Custom Hint Modal -->
    <div id="hintModal" class="modal-overlay">
        <div class="bg-white p-6 rounded-3xl shadow-2xl max-w-sm w-11/12 text-center border-4 border-yellow-400 transform scale-100 transition-transform duration-200">
            <div class="text-5xl mb-2">😅</div>
            <h3 class="text-2xl font-bold mb-4 text-gray-800">앗, 다시 생각해 볼까요?</h3>
            <p id="hintText" class="text-lg text-gray-600 mb-6 leading-relaxed"></p>
            <button onclick="closeHint()" class="btn-bounce bg-yellow-400 hover:bg-yellow-500 text-gray-800 font-bold text-xl py-3 px-8 rounded-2xl w-full">다시 해볼게요!</button>
        </div>
    </div>

    <!-- Celebration Modal -->
    <div id="successModal" class="modal-overlay z-50">
        <div class="bg-white p-6 rounded-3xl shadow-2xl max-w-sm w-11/12 text-center border-4 border-green-400">
            <div class="text-6xl mb-2">🌟</div>
            <h3 class="text-2xl font-bold mb-4 text-green-600">정답이에요! 참 잘했어요!</h3>
            <button onclick="closeSuccess()" class="btn-bounce bg-green-400 hover:bg-green-500 text-white font-bold text-xl py-3 px-8 rounded-2xl w-full">다음으로</button>
        </div>
    </div>

    <script>
        let currentWord = "";
        let baseWord = "";
        let isChangingFormActual = false;
        let successCallback = null;
        let currentCharIndex = 0;
        let charList = [];

        // 한글 자음, 모음, 받침 배열 (유니코드 분해용)
        const CHO = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
        const JUNG = ['ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅗ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅛ', 'ㅜ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅠ', 'ㅡ', 'ㅢ', 'ㅣ'];
        const JONG = ['(받침 없음)', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

        function showStep(stepId) {
            document.querySelectorAll('.step-container').forEach(el => el.classList.remove('active'));
            document.getElementById(stepId).classList.add('active');
        }

        function showHint(message) {
            document.getElementById('hintText').innerHTML = message;
            document.getElementById('hintModal').classList.add('active');
        }

        function closeHint() {
            document.getElementById('hintModal').classList.remove('active');
        }

        function showSuccess(callback) {
            successCallback = callback;
            document.getElementById('successModal').classList.add('active');
        }

        function closeSuccess() {
            document.getElementById('successModal').classList.remove('active');
            if (successCallback) successCallback();
        }

        // 입력받은 단어가 동사/형용사(바뀌는 낱말)인지 판별하는 정교한 알고리즘
        function checkIsChangingForm(word) {
            if (!word) return false;
            
            // 1. 이미 '다'로 끝나는 경우 (기본형)
            if (word.endsWith('다')) return true;

            // 2. 기본형 후보가 존재하면 형태가 바뀌는 낱말임
            const baseForms = getCorrectBaseForms(word);
            if (baseForms.length > 0) return true;

            // 3. 동사/형용사 어미 패턴 검사 ('해', '해요', '해서', '하니', '아', '어', '요', '고', '면' 등)
            const changingEndings = ['해', '해요', '해서', '하니', '하고', '하면', '한', '하여',
                                     '고', '니', '서', '면', '아', '어', '요', '지', '게', '은', '는',
                                     '워', '운', '파', '퍼', '뻐', '빠', '써', '라', '러', '려', '셔', '져', '네', '군', '구나'];
            
            for (let ending of changingEndings) {
                if (word.endsWith(ending) && word.length > ending.length) {
                    return true;
                }
            }

            return false;
        }

        function startJourney() {
            const input = document.getElementById('wordInput').value.trim();
            if (!input) {
                showHint("찾고 싶은 낱말을 입력해 주세요!");
                return;
            }
            
            // 한글인지 확인
            const koreanPattern = /^[가-힣]+$/;
            if (!koreanPattern.test(input)) {
                showHint("한글 낱말만 입력해 주세요!");
                return;
            }

            currentWord = input;
            isChangingFormActual = checkIsChangingForm(currentWord);
            
            document.getElementById('displayWord1').innerText = currentWord;
            showStep('step2');
        }

        // 낱말의 올바른 기본형 후보 목록을 계산하는 정교한 함수
        function getCorrectBaseForms(word) {
            if (!word) return [];
            if (word.endsWith('다')) return [word];

            const candidates = new Set();
            
            // '-하다' 계열 어미 ('~해', '~해서', '~하니', '~하면', '~하고', '~한', '~하게', '~스럽다', '~답다' 등)
            const haEndings = ['스럽게', '스럽고', '스러운', '스럽다', '스러워', '스러워서', '스러우니',
                               '답게', '답고', '다운', '답다', '다워', '다워서',
                               '하게', '하고', '하니', '해서', '하면', '한', '합니다', '하여', '해요', '해'];

            for (let ending of haEndings) {
                if (word.endsWith(ending)) {
                    let stem = word.slice(0, word.length - ending.length);
                    if (ending.startsWith('스럽')) {
                        candidates.add(stem + '스럽다');
                    } else if (ending.startsWith('답')) {
                        candidates.add(stem + '답다');
                    } else if (ending.startsWith('하') || ending === '한' || ending === '해요' || ending === '하여' || ending === '해') {
                        candidates.add(stem + '하다');
                    }
                }
            }

            // 일반 어미 목록
            const endings = [
                '습니다', 'ㅂ니다', '려고', '하려면', '면서', '니까', '는데', '은데', 'ㄴ데', '거든', '잖아',
                '고', '게', '니', '면', '며', '서', '도', '자', '지', '죠', '네', '나', '냐', '군', '구나',
                '어', '아', '요', '은', '는', '을', '를', '던', '았어', '었어', '았고', '었고', '았다', '었다'
            ];

            for (let ending of endings) {
                if (word.endsWith(ending)) {
                    let stem = word.slice(0, word.length - ending.length);
                    if (stem.length > 0) {
                        candidates.add(stem + '다');
                    }
                }
            }

            // 'ㅂ' 불규칙 활용 처리 (예: 무서워/무서워서/무서운 ➔ 무섭다, 아름다워/아름다운 ➔ 아름답다)
            const bEndings = ['워서', '우니', '우면', '워', '운'];
            for (let ending of bEndings) {
                if (word.endsWith(ending)) {
                    let stemPrefix = word.slice(0, word.length - ending.length);
                    if (stemPrefix.length > 0) {
                        let lastChar = stemPrefix.charAt(stemPrefix.length - 1);
                        let code = lastChar.charCodeAt(0);
                        if (code >= 0xAC00 && code <= 0xD7A3) {
                            let baseCode = code - 0xAC00;
                            let jong = baseCode % 28;
                            if (jong === 0) { // 받침이 없는 경우 'ㅂ' 받침(유니코드 offset +17) 추가
                                let newChar = String.fromCharCode(code + 17);
                                candidates.add(stemPrefix.slice(0, -1) + newChar + '다');
                            }
                        }
                    }
                }
            }

            // 'ㅡ' 탈락 활용 처리 (예: 예뻐서 ➔ 예쁘다, 슬퍼서 ➔ 슬프다, 아파서 ➔ 아프다)
            const euMap = {
                '뻐': '쁘', '뻐서': '쁘', '뻐요': '쁘',
                '퍼': '프', '퍼서': '프', '퍼요': '프',
                '파': '프', '파서': '프', '파요': '프',
                '빠': '쁘', '빠서': '쁘', '빠요': '쁘',
                '써': '쓰', '써서': '쓰', '써요': '쓰',
                '커': '크', '커서': '크', '커요': '크'
            };
            for (let key in euMap) {
                if (word.endsWith(key)) {
                    let stemPrefix = word.slice(0, word.length - key.length);
                    candidates.add(stemPrefix + euMap[key] + '다');
                }
            }

            // '르' 불규칙 활용 처리 (예: 빨라서/빨라 ➔ 빠르다, 흘러서/흘러 ➔ 흐르다)
            if (word.endsWith('라') || word.endsWith('라서') || word.endsWith('러') || word.endsWith('러서')) {
                let cutLen = (word.endsWith('라서') || word.endsWith('러서')) ? 2 : 1;
                let stemPrefix = word.slice(0, word.length - cutLen);
                if (stemPrefix.length > 0) {
                    let lastChar = stemPrefix.charAt(stemPrefix.length - 1);
                    let code = lastChar.charCodeAt(0);
                    if (code >= 0xAC00 && code <= 0xD7A3) {
                        let baseCode = code - 0xAC00;
                        let jong = baseCode % 28;
                        if (jong === 8) { // 'ㄹ' 받침 제거 후 '-르다' 조합
                            let newChar = String.fromCharCode(code - 8);
                            candidates.add(stemPrefix.slice(0, -1) + newChar + '르다');
                        }
                    }
                }
            }

            // 축약 활용 처리 (예: 달려/달려서 ➔ 달리다, 마셔/마셔서 ➔ 마시다)
            const yeoEndings = ['려', '려서', '려요', '셔', '셔서', '셔요', '져', '져서', '져요', '켜', '켜서', '켜요', '녀', '녀서', '녀요'];
            for (let ending of yeoEndings) {
                if (word.endsWith(ending)) {
                    let cutLen = ending.length;
                    let stemPrefix = word.slice(0, word.length - cutLen);
                    let lastChar = ending.charAt(0);
                    let iCharMap = { '려': '리', '셔': '시', '져': '지', '켜': '키', '녀': '니' };
                    if (iCharMap[lastChar]) {
                        candidates.add(stemPrefix + iCharMap[lastChar] + '다');
                    }
                }
            }

            return Array.from(candidates);
        }

        function checkFormChange(userChoice) {
            if (userChoice === isChangingFormActual) {
                showSuccess(() => {
                    if (isChangingFormActual) {
                        // 형태가 바뀌는 낱말이면 3단계(기본형 만들기)로 이동
                        document.getElementById('displayWord2').innerText = currentWord;
                        document.getElementById('baseFormInput').value = "";
                        showStep('step3');
                    } else {
                        // 형태가 안바뀌는 낱말이면 바로 4단계(사전 찾기)로 이동
                        baseWord = currentWord;
                        prepareDictionaryGuide();
                        showStep('step4');
                    }
                });
            } else {
                let hintMsg = "";
                if (isChangingFormActual) {
                    const sampleBase = getCorrectBaseForms(currentWord)[0] || (currentWord + '다');
                    hintMsg = `<b>'${currentWord}'</b>은(는) 문장에 따라 형태가 바뀌는 낱말이에요.<br><br>예: <b>'${sampleBase}'</b>처럼 움직임이나 성질/상태를 나타내는지 확인해보세요!`;
                } else {
                    hintMsg = `<b>'${currentWord}'</b>은(는) 형태가 바뀌지 않는 낱말이에요.<br><br>예: '책상, 학교' 처럼 이름을 나타내는 낱말인지 확인해보세요!`;
                }
                showHint(hintMsg);
            }
        }

        function checkBaseForm() {
            const inputBase = document.getElementById('baseFormInput').value.trim();
            
            if (!inputBase) {
                showHint("기본형을 입력해 주세요!");
                return;
            }

            // 기본형은 반드시 '다'로 끝나야 함
            if (!inputBase.endsWith('다')) {
                showHint("형태가 바뀌지 않는 부분에 <b>'-다'</b>를 붙여야 해요!<br>예: 먹고 ➔ 먹<b>다</b>");
                return;
            }

            // 정확한 기본형 검증 수행
            const expectedBaseForms = getCorrectBaseForms(currentWord);

            if (expectedBaseForms.length > 0) {
                if (expectedBaseForms.includes(inputBase)) {
                    baseWord = inputBase;
                    showSuccess(() => {
                        prepareDictionaryGuide();
                        showStep('step4');
                    });
                } else {
                    const mainTarget = expectedBaseForms[0];
                    const stem = mainTarget.slice(0, -1);
                    showHint(`<b>'${currentWord}'</b>의 형태가 바뀌지 않는 부분은 <b>'${stem}'</b>이에요.<br><br>올바른 기본형은 <b>'${mainTarget}'</b>입니다! 다시 작성해 보세요.`);
                }
            } else {
                // 기타 규칙형의 경우 첫 글자 대조 검증
                if (inputBase.charAt(0) !== currentWord.charAt(0)) {
                    showHint(`원래 낱말인 <b>'${currentWord}'</b>의 형태가 바뀌지 않는 부분을 잘 찾아보세요!`);
                    return;
                }
                baseWord = inputBase;
                showSuccess(() => {
                    prepareDictionaryGuide();
                    showStep('step4');
                });
            }
        }

        function decomposeHangul(char) {
            const charCode = char.charCodeAt(0);
            // 한글 가~힣 사이인지 확인
            if (charCode < 0xAC00 || charCode > 0xD7A3) {
                return null;
            }
            
            const baseCode = charCode - 0xAC00;
            const choIndex = Math.floor(baseCode / 588);
            const jungIndex = Math.floor((baseCode - (choIndex * 588)) / 28);
            const jongIndex = baseCode % 28;

            return {
                cho: CHO[choIndex],
                jung: JUNG[jungIndex],
                jong: JONG[jongIndex]
            };
        }

        function prepareDictionaryGuide() {
            document.getElementById('finalWord').innerText = baseWord;
            charList = [];

            // 낱말의 모든 글자를 분해하여 목록에 저장
            for (let i = 0; i < baseWord.length; i++) {
                const char = baseWord.charAt(i);
                const decomposed = decomposeHangul(char);
                if (decomposed) {
                    charList.push({ char: char, decomposed: decomposed });
                }
            }

            currentCharIndex = 0;
            renderCurrentCharGuide();
        }

        function renderCurrentCharGuide() {
            const container = document.getElementById('charGuideContainer');
            const iconEl = document.getElementById('step4Icon');
            iconEl.innerText = "🔍";

            if (charList.length === 0) return;

            // 모든 글자를 다 찾았을 때 (완료 화면)
            if (currentCharIndex >= charList.length) {
                iconEl.innerText = "🎉";
                let summaryItems = charList.map((item, idx) => {
                    const d = item.decomposed;
                    return `<span class="inline-block bg-green-100 text-green-800 px-3 py-1 rounded-full font-bold m-1 text-xs sm:text-sm">${idx+1}. ${item.char} (${d.cho}➔${d.jung}${d.jong !== '(받침 없음)' ? '➔' + d.jong : ''})</span>`;
                }).join(' ➔ ');

                container.innerHTML = `
                    <div class="bg-green-50 border-4 border-green-300 rounded-3xl p-6 shadow-md my-2 animate-fadeIn">
                        <div class="text-6xl mb-3">🏆</div>
                        <h3 class="text-2xl font-bold text-green-700 mb-2">우와! 탐험 성공!</h3>
                        <p class="text-lg text-gray-700 mb-4">
                            <b>'${baseWord}'</b> 낱말을 국어사전에서 모두 찾았어요!
                        </p>
                        <div class="bg-white p-4 rounded-2xl border border-green-200 text-left mb-4">
                            <p class="text-sm font-bold text-green-600 mb-2">📍 차례대로 찾아본 과정:</p>
                            <div class="flex flex-wrap items-center">${summaryItems}</div>
                        </div>

                        <!-- 문맥에 알맞은 뜻 적기 안내 카드가 추가되었습니다 -->
                        <div class="bg-yellow-100 border-2 border-yellow-400 p-4 rounded-2xl text-left shadow-sm">
                            <div class="flex items-center space-x-2 mb-2">
                                <span class="text-2xl">📝</span>
                                <span class="text-base font-bold text-yellow-900">마지막 활동!</span>
                            </div>
                            <p class="text-lg font-bold text-yellow-900 leading-snug mb-2">
                                사전에서 찾은 뜻 중에서 문맥에 가장 알맞은 뜻을 찾아 적으세요.
                            </p>
                            <p class="text-xs text-yellow-800 mb-3">
                                💡 국어사전에는 한 낱말에 여러 가지 뜻이 실려 있을 수 있어요. 우리 문장에 가장 딱 맞는 뜻을 골라 아래에 정리해 보세요!
                            </p>
                            <textarea class="w-full p-3 border-2 border-yellow-300 rounded-xl text-sm focus:outline-none focus:border-yellow-500 bg-white" placeholder="사전에서 찾은 알맞은 뜻을 여기에 직접 써보세요! (예: 음식을 입을 통하여 배 속에 넣다.)" rows="3"></textarea>
                        </div>
                    </div>
                `;
                return;
            }

            // 현재 찾을 글자 정보
            const item = charList[currentCharIndex];
            const char = item.char;
            const decomposed = item.decomposed;
            const total = charList.length;

            const jongText = decomposed.jong === '(받침 없음)' ? '없음' : decomposed.jong;
            const jongInstruction = decomposed.jong === '(받침 없음)'
                ? '3️⃣ <b>받침이 없는 낱말</b>을 먼저 찾아요.'
                : `3️⃣ <b>받침</b> <span class="text-green-600 font-bold">[ ${decomposed.jong} ]</span> 순서로 찾아요.`;

            const nextCharName = (currentCharIndex + 1 < total) ? charList[currentCharIndex + 1].char : '';

            container.innerHTML = `
                <!-- 진행 상태 바 -->
                <div class="mb-4">
                    <div class="flex justify-between text-xs font-bold text-gray-500 mb-1 px-1">
                        <span>글자 찾기 진행 상황</span>
                        <span>${currentCharIndex + 1} / ${total} 글자</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                        <div class="bg-green-500 h-3 rounded-full transition-all duration-300" style="width: ${((currentCharIndex + 1) / total) * 100}%"></div>
                    </div>
                </div>

                <!-- 현재 글자 안내 카드 -->
                <div class="bg-white border-2 border-green-400 rounded-2xl p-4 shadow-sm text-left animate-fadeIn">
                    <div class="flex items-center justify-between mb-3 border-b border-green-100 pb-2">
                        <span class="bg-green-500 text-white px-3 py-1 rounded-full text-xs font-bold">${currentCharIndex + 1}번째 글자</span>
                        <span class="text-3xl font-bold text-green-700">"${char}"</span>
                    </div>

                    <!-- 초성/중성/종성 박스 -->
                    <div class="flex justify-center space-x-2 mb-3">
                        <div class="flex flex-col items-center">
                            <span class="text-xs text-gray-500 mb-1 font-bold">1.첫 자음자</span>
                            <div class="char-box bg-red-100 text-red-600 border border-red-300 font-bold">${decomposed.cho}</div>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-xs text-gray-500 mb-1 font-bold">2.모음자</span>
                            <div class="char-box bg-blue-100 text-blue-600 border border-blue-300 font-bold">${decomposed.jung}</div>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-xs text-gray-500 mb-1 font-bold">3.받침</span>
                            <div class="char-box bg-green-100 text-green-600 border border-green-300 font-bold">${jongText}</div>
                        </div>
                    </div>

                    <!-- 순서 가이드 -->
                    <div class="bg-yellow-50 p-3 rounded-xl text-sm space-y-1.5 border border-yellow-200 mb-4 leading-relaxed">
                        <p class="font-bold text-gray-700 mb-1">📖 사전에서 <b>'${char}'</b> 자를 찾는 방법:</p>
                        <p>1️⃣ 첫 자음자 <span class="text-red-500 font-bold">[ ${decomposed.cho} ]</span> 순서로 찾아요.</p>
                        <p>2️⃣ 그 다음 모음자 <span class="text-blue-500 font-bold">[ ${decomposed.jung} ]</span> 순서로 찾아요.</p>
                        <p>${jongInstruction}</p>
                    </div>

                    <!-- 확인 질문 및 버튼 -->
                    <div class="bg-green-50 border border-green-200 p-3 rounded-xl text-center">
                        <p class="text-base font-bold text-green-900 mb-2">
                            사전에서 <span class="text-xl text-red-500 font-bold">'${char}'</span> 자를 찾았나요?
                        </p>
                        <button onclick="nextCharStep()" class="btn-bounce w-full bg-green-500 hover:bg-green-600 text-white text-lg py-3 px-4 rounded-xl font-bold shadow flex items-center justify-center space-x-2">
                            <span>네! '${char}' 자를 찾았어요!</span>
                            ${nextCharName ? `<span class="text-xs bg-green-700 px-2 py-0.5 rounded-lg opacity-90">(다음 '${nextCharName}' 자 ➔)</span>` : `<span>🎉</span>`}
                        </button>
                    </div>
                </div>
            `;
        }

        function nextCharStep() {
            currentCharIndex++;
            renderCurrentCharGuide();
        }

        function resetApp() {
            document.getElementById('wordInput').value = "";
            showStep('step1');
        }

        // 엔터키 입력 지원
        document.getElementById('wordInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') startJourney();
        });
        document.getElementById('baseFormInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkBaseForm();
        });

    </script>
</body>
</html>
